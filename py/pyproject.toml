[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datum-sim"
version = "0.2.1"
description = "Datum Sim from Python: open, change, run and sweep models (uses the datum-sim-cli program that comes with the app)"
readme = "README-python.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["datum_sim"]
